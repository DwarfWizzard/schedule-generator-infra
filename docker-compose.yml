version: "3.9"

services:
  #POSTGRES
  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DBNAME}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      back:
        ipv4_address: ${NET_POSTGRES}
      default:

  #API_SERVICE
  backend:
    image: schedule-generator-back
    build: 
      context: ../schedule-generator
    environment:
      API_PORT: ${API_PORT}
      POSTGRES_CONNECTION_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${NET_POSTGRES}:5432/${POSTGRES_DBNAME}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ACCESS_TTL: ${ACCESS_TTL}
      REFRESH_TTL: ${REFRESH_TTL}
      PASSWORD_SALT: ${PASSWORD_SALT}
      MIGRATION: ${MIGRATION}
    ports: 
      - "8008:8008"
    networks:
      back:
        ipv4_address: ${NET_API_SERVICE}
      default:
    restart: always
    depends_on:
      - postgres
    links:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"

  web:
    image: schedule-generator-web
    build: 
      context: ../schedule-generator-web
      args:
        - NEXT_PUBLIC_API_URL=http://${API_HOST}:${API_PORT}
    environment:
      NEXT_PUBLIC_API_URL: "http://${API_HOST}:${API_PORT}"
      API_URL: "http://backend:${API_PORT}"
    tty: true
    stdin_open: true
    ports: 
      - "3000:3000"
    networks:
      back:
        ipv4_address: ${NET_WEB}
      default:
    restart: always
    depends_on:
      - postgres
      - backend
    links:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"

networks:
  back:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${NET}
  default:
    driver: bridge